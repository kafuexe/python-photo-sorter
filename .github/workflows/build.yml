name: Build

on:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest tests/ -v

  build:
    needs: test
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt pyinstaller

      - name: Build exe
        run: pyinstaller photo_sorter.spec --clean -y

      - name: Build installer
        uses: jrsoftware/iscc-action@v1
        with:
          script-path: installer.iss

      - name: Upload exe
        uses: actions/upload-artifact@v4
        with:
          name: PhotoSorter-exe
          path: dist/PhotoSorter.exe

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: PhotoSorter-installer
          path: dist/PhotoSorterSetup.exe
